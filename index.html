<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | Paisa Ledger</title><link rel="stylesheet" href="style.css"></head>
<body data-guest="1"><div class="auth">
<aside><h1>Paisa Ledger</h1><p>Turn your loan master file into reducing-balance repayment schedules, with rate resets and exact closure, ready to print for each borrower.</p></aside>
<main><form class="box" id="loginForm"><h2>Log in</h2>
<label for="e">Email</label><input id="e" name="email" type="email" required autocomplete="email">
<label for="p">Password</label><input id="p" name="pw" type="password" required autocomplete="current-password">
<p class="msg" id="msg" role="alert"></p><button class="btn" type="submit">Log in</button>
<p>New here? <a href="signup.html">Create an account</a></p></form></main></div><script src="app.js"></script></body></html>
