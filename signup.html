<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | Paisa Ledger</title><link rel="stylesheet" href="style.css"></head>
<body data-guest="1"><div class="auth">
<aside><h1>Create your account</h1><p>Set up access for your lending operations team. It takes under a minute.</p></aside>
<main><form class="box" id="signupForm"><h2>Sign up</h2>
<label for="n">Full name</label><input id="n" name="name" required autocomplete="name">
<label for="e">Work email</label><input id="e" name="email" type="email" required autocomplete="email">
<label for="p">Password</label><input id="p" name="pw" type="password" required minlength="8" autocomplete="new-password">
<label for="p2">Confirm password</label><input id="p2" name="pw2" type="password" required autocomplete="new-password">
<p class="msg" id="msg" role="alert"></p><button class="btn" type="submit">Create account</button>
<p>Already registered? <a href="index.html">Log in</a></p></form></main></div><script src="app.js"></script></body></html>
